<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise Catalogue Editor</title>
  <!-- Reuse the same stylesheet to maintain consistent look and feel -->
  <link rel="stylesheet" href="style.css">
  <!-- Load the existing exercises catalogue -->
  <script src="exercises.js"></script>
</head>
<body>
  <header>
    <h1>Exercise Catalogue Editor</h1>
  </header>
  <main>
    <section class="controls">
      <h2>Current Exercises</h2>
      <table id="exerciseTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Muscle Group</th>
            <th>Description</th>
            <th>Equipment</th>
            <th>Push/Pull</th>
            <th>Body Region</th>
            <th>Environment</th>
            <th>Video</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamically populated by editor.js -->
        </tbody>
      </table>
      <button id="addExerciseBtn">Add Exercise</button>
    </section>

    <section class="controls">
      <h2 id="formTitle">Add/Edit Exercise</h2>
      <form id="exerciseForm" onsubmit="return false;">
        <!-- Hidden index field for editing existing entries -->
        <input type="hidden" id="exerciseIndex" value="">
        <label>
          Name:
          <input type="text" id="name" required>
        </label>
        <label>
          Muscle Group:
          <input type="text" id="muscleGroup" required>
        </label>
        <label>
          Description:
          <textarea id="description" rows="3" required></textarea>
        </label>
        <label>
          Equipment (comma separated):
          <input type="text" id="equipment" required>
        </label>
        <label>
          Push/Pull:
          <select id="pushPullSelect" required>
            <option value="push">Push</option>
            <option value="pull">Pull</option>
          </select>
        </label>
        <label>
          Body Region:
          <select id="bodyRegionSelect" required>
            <option value="upper">Upper</option>
            <option value="lower">Lower</option>
            <option value="full">Full</option>
          </select>
        </label>
        <label>
          Environment:
          <select id="environmentSelect" required>
            <option value="home">Home</option>
            <option value="gym">Gym</option>
            <option value="both">Both</option>
          </select>
        </label>
        <label>
          Video URL:
          <input type="url" id="video" required>
        </label>
        <button type="submit" id="saveExerciseBtn">Save Exercise</button>
      </form>
      <button id="downloadBtn">Download Updated JS</button>
    </section>
  </main>
  <footer>
    <a href="index.html">Back to Generator</a>
  </footer>
  <script src="editor.js"></script>
</body>
</html>
