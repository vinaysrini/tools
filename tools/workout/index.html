<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full‑Body Workout Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Full‑Body Workout Generator</h1>
    <p class="subtitle">Create on‑demand supersets tailored to your equipment and time constraints. Warmups and cooldowns are intentionally omitted.</p>
    <div id="controls" class="controls">
      <div class="form‑group">
        <label class="label">Available equipment:</label>
        <div class="equipment‑list">
          <label><input type="checkbox" name="equipment" value="barbell" checked> Barbell</label>
          <label><input type="checkbox" name="equipment" value="dumbbell" checked> Dumbbell</label>
          <label><input type="checkbox" name="equipment" value="kettlebell" checked> Kettlebell</label>
          <label><input type="checkbox" name="equipment" value="body weight" checked> Body weight</label>
          <label><input type="checkbox" name="equipment" value="gym"> Gym (all)</label>
        </div>
      </div>
      <div class="form‑group">
        <label class="label" for="duration">Workout duration:</label>
        <select id="duration">
          <option value="45">45 minutes</option>
          <option value="60">60 minutes</option>
        </select>
      </div>
      <div class="form‑group">
        <label class="label" for="supersetSize">Exercises per superset:</label>
        <select id="supersetSize">
          <option value="2">2 exercises</option>
          <option value="3">3 exercises</option>
        </select>
      </div>
      <div class="form‑group generate">
        <button id="generateBtn" class="btn">Generate workout</button>
      </div>
    </div>
    <div id="workout" class="workout"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
