<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Full Body Workout Generator</title>
  <!-- Link to our custom stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Load the exercise catalogue; this script defines the global `exercises` array -->
  <script src="exercises.js"></script>
</head>
<body>
  <header>
    <h1>Custom Full‑Body Workout Generator</h1>
  </header>

  <main>
    <!-- Control panel where the user selects parameters for their workout -->
    <section class="controls">
      <h2>Workout Options</h2>
      <form id="workoutForm" onsubmit="return false;">
        <label>
          Environment:
          <select id="environment">
            <option value="gym">Gym</option>
            <option value="home">Home</option>
          </select>
        </label>
        <label>
          Push/Pull:
          <select id="pushPull">
            <option value="no-preference">No Preference</option>
            <option value="push">Push Day</option>
            <option value="pull">Pull Day</option>
          </select>
        </label>
        <label>
          Body Region:
          <select id="bodyRegion">
            <option value="full">Full Body</option>
            <option value="upper">Upper Body</option>
            <option value="lower">Lower Body</option>
          </select>
        </label>
        <label>
          Exercises Per Set:
          <select id="exercisesPerSet">
            <option value="2">2</option>
            <option value="3" selected>3</option>
          </select>
        </label>
        <label>
          Number of Sets:
          <select id="numSets">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </label>
        <button type="button" id="generateBtn">Generate Workout</button>
      </form>
    </section>

    <!-- Container where the generated workout supersets will be inserted -->
    <section id="workoutOutput"></section>
  </main>

  <footer>
    <!-- Link to the editor page that lets users modify the exercise catalogue -->
    <a href="editor.html">Exercise Editor</a>
  </footer>

  <!-- Our script that handles workout generation -->
  <script src="script.js"></script>
</body>
</html>
