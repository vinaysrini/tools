<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Custom Full Body Workout Generator</title>
  <!-- iOS home screen icon and web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <meta name="theme-color" content="#4A90E2">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.json">
  <!-- Font Awesome for icons - optimized loading -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css">
  <!-- Link to our custom stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Load the exercise catalogue; this script defines the global `exercises` array -->
  <script src="exercises.js"></script>
</head>
<body>
  <header>
    <div class="header-container">
      <h1>Workout</h1>
      <div id="editBtnContainer"></div>
    </div>
  </header>

  <main>
    <!-- Control panel where the user selects parameters for their workout -->
    <section class="controls">
      <h2>Workout Options</h2>
      <form id="workoutForm" onsubmit="return false;">
        <label>
          Environment:
          <select id="environment">
            <option value="gym">Gym</option>
            <option value="home">Home</option>
          </select>
        </label>
        <label>
          Push/Pull:
          <select id="pushPull">
            <option value="no-preference">No Preference</option>
            <option value="push">Push Day</option>
            <option value="pull">Pull Day</option>
          </select>
        </label>
        <label>
          Body Region:
          <select id="bodyRegion">
            <option value="full">Full Body</option>
            <option value="upper">Upper Body</option>
            <option value="lower">Lower Body</option>
          </select>
        </label>
        <label>
          Exercises Per Set:
          <select id="exercisesPerSet">
            <option value="2">2</option>
            <option value="3" selected>3</option>
          </select>
        </label>
        <label>
          Number of Sets:
          <select id="numSets">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </label>
        <button type="button" id="generateBtn" class="icon-btn primary-btn" title="Generate Workout"><i class="fas fa-dumbbell"></i> <span class="btn-text">Generate</span></button>
      </form>
    </section>

    <!-- Container where the generated workout supersets will be inserted -->
    <section id="workoutOutput"></section>
  </main>

  <!-- Touch gestures for mobile devices -->
  <script src="touch-gestures.js"></script>
  <!-- Our script that handles workout generation -->
  <script src="script.js"></script>
</body>
</html>
