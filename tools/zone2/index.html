<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Rate Zone Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 24px 16px;
            color: #333;
        }

        .container { max-width: 520px; margin: 0 auto; }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #666;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .back-link:hover { color: #1a1a1a; }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid #e8e8e8;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stepper-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #555;
            flex-shrink: 0;
        }
        .stepper-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #666;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }
        .radio-group label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            cursor: pointer;
        }

        .mhr-options {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .mhr-options label {
            font-size: 0.8rem;
            color: #666;
        }

        select {
            margin-top: 6px;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
            background: #fff;
            width: 100%;
        }

        .custom-mhr { margin-top: 12px; }

        .zones {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zone {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .zone-name { font-weight: 600; }
        .zone-desc { font-size: 0.8rem; opacity: 0.9; }
        .zone-range { font-weight: 600; font-variant-numeric: tabular-nums; }

        .zone1 { background: #4a90d9; }
        .zone2 { background: #5cb85c; }
        .zone3 { background: #f0ad4e; }
        .zone4 { background: #e74c3c; }
        .zone5 { background: #9b59b6; }

        .mhr-note {
            font-size: 0.8rem;
            color: #888;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .error { color: #c0392b; font-size: 0.85rem; margin-top: 4px; }
        .hidden { display: none; }

        @media (max-width: 480px) {
            .zone {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .zone-range { justify-self: start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">← Back to tools</a>

        <div class="card">
            <h1>Heart Rate Zone Calculator</h1>
            <p class="subtitle">Uses Karvonen (HR Reserve) formula for personalized zones</p>

            <form id="zoneForm" oninput="calculateZones()">
                <div class="form-group">
                    <label for="age">Age</label>
                    <div class="input-row">
                        <button type="button" class="stepper-btn" onclick="adjust('age', -1)">−</button>
                        <input type="number" id="age" min="15" max="100" value="35">
                        <button type="button" class="stepper-btn" onclick="adjust('age', 1)">+</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="restingHeartRate">Resting heart rate (bpm)</label>
                    <div class="input-row">
                        <button type="button" class="stepper-btn" onclick="adjust('restingHeartRate', -1)">−</button>
                        <input type="number" id="restingHeartRate" min="30" max="100" value="60">
                        <button type="button" class="stepper-btn" onclick="adjust('restingHeartRate', 1)">+</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Gender (affects MHR formula)</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" checked> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                    </div>
                </div>

                <div class="mhr-options">
                    <label for="mhrMethod">Max heart rate method</label>
                    <select id="mhrMethod" onchange="calculateZones()">
                        <option value="tanaka">Tanaka: 208 − 0.7×age</option>
                        <option value="fox">Fox: 220 − age</option>
                        <option value="hunt">HUNT: 211 − 0.64×age</option>
                        <option value="custom">Custom (measured)</option>
                    </select>
                    <div id="customMhrWrap" class="custom-mhr hidden">
                        <label for="customMhr">Your measured max HR (bpm)</label>
                        <input type="number" id="customMhr" min="120" max="220" value="185" style="width: 100%;">
                    </div>
                </div>
            </form>
        </div>

        <div class="card">
            <div id="result" class="zones"></div>
            <p class="mhr-note" id="mhrNote"></p>
        </div>
    </div>

    <script>
        const ZONE_INFO = [
            { name: 'Zone 1', pct: '50–60%', desc: 'Recovery, warm-up', low: 0.50, high: 0.60 },
            { name: 'Zone 2', pct: '60–70%', desc: 'Endurance, fat burn', low: 0.60, high: 0.70 },
            { name: 'Zone 3', pct: '70–80%', desc: 'Aerobic, tempo', low: 0.70, high: 0.80 },
            { name: 'Zone 4', pct: '80–90%', desc: 'Threshold, lactate', low: 0.80, high: 0.90 },
            { name: 'Zone 5', pct: '90–100%', desc: 'VO₂max, max effort', low: 0.90, high: 1.00 }
        ];

        function getMaxHR() {
            const age = parseInt(document.getElementById('age').value) || 35;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const method = document.getElementById('mhrMethod').value;

            if (method === 'custom') {
                return parseInt(document.getElementById('customMhr').value) || 185;
            }
            if (method === 'tanaka') return Math.round(208 - 0.7 * age);
            if (method === 'hunt') return Math.round(211 - 0.64 * age);
            return gender === 'female' ? 226 - age : 220 - age;
        }

        function calculateZones() {
            const age = parseInt(document.getElementById('age').value) || 35;
            const rhr = parseInt(document.getElementById('restingHeartRate').value) || 60;
            const maxHR = getMaxHR();

            document.getElementById('customMhrWrap').classList.toggle('hidden', document.getElementById('mhrMethod').value !== 'custom');

            const hrr = maxHR - rhr;
            if (hrr <= 0) {
                document.getElementById('result').innerHTML = '<p class="error">Resting HR must be lower than max HR. Check your inputs.</p>';
                return;
            }

            const zonesHtml = ZONE_INFO.map((z, i) => {
                const low = Math.round(hrr * z.low + rhr);
                const high = Math.round(hrr * z.high + rhr);
                return `<div class="zone zone${i + 1}">
                    <span class="zone-name">${z.name}</span>
                    <span class="zone-desc">${z.desc} (${z.pct})</span>
                    <span class="zone-range">${low}–${high} bpm</span>
                </div>`;
            }).join('');

            document.getElementById('result').innerHTML = zonesHtml;
            document.getElementById('mhrNote').textContent = `Estimated max HR: ${maxHR} bpm • HR Reserve: ${hrr} bpm`;
        }

        function adjust(id, delta) {
            const input = document.getElementById(id);
            const min = parseInt(input.min) || 0;
            const max = parseInt(input.max) || 999;
            let val = (parseInt(input.value) || 0) + delta;
            input.value = Math.max(min, Math.min(max, val));
            calculateZones();
        }

        document.getElementById('mhrMethod').addEventListener('change', () => {
            document.getElementById('customMhrWrap').classList.toggle('hidden', document.getElementById('mhrMethod').value !== 'custom');
            calculateZones();
        });

        calculateZones();
    </script>
</body>
</html>
